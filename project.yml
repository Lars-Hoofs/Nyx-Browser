name: Nyx
options:
  bundleIdPrefix: com.larshoofs
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  NyxCore:
    path: NyxCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  Nyx:
    type: application
    platform: macOS
    sources:
      - Nyx
    dependencies:
      - package: NyxCore
    entitlements:
      path: Nyx/Nyx.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # M6 downloads (spec §5.7): sandboxed write access to ~/Downloads.
        com.apple.security.files.downloads.read-write: true
    info:
      path: Nyx/Info.plist
      properties:
        CFBundleDisplayName: Nyx
        LSMinimumSystemVersion: "26.0"
        NSMainNibFile: ""
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHumanReadableCopyright: ""

  NyxUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - NyxUITests
    dependencies:
      - target: Nyx
    info:
      path: NyxUITests/Info.plist
      properties:
        CFBundleDisplayName: NyxUITests

  NyxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NyxTests
    dependencies:
      - target: Nyx
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nyx.app/Contents/MacOS/Nyx"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nyx:
    build:
      targets:
        Nyx: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NyxTests
        - NyxUITests
